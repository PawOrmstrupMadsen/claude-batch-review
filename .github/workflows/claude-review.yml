name: Claude review
# This repo reviews its own PRs with the action as checked out (`uses: ./`); other repos copy
# examples/claude-review.yml instead.
on:
  pull_request:
    # labeled/unlabeled re-evaluate the override label, reusing the head commit's stored review.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      force:
        description: Re-review a commit that already has a review
        type: boolean
        default: false

concurrency:
  # Label events get their own group, so adding a label never cancels a review that is still waiting.
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}-${{ contains(github.event.action, 'labeled') && 'label' || 'review' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # The job name is the status check that rulesets require.
    name: Claude review
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          api-keys: ${{ secrets.ANTHROPIC_REVIEW_KEYS }}
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          force: ${{ inputs.force || false }}
          mode: pass
          max-wait-minutes: 45
