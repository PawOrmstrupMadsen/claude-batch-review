name: Claude review
# Advisory PR review by Claude through the Message Batches API (PawOrmstrupMadsen/claude-batch-review).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      force:
        description: Re-review a commit that already has a review
        type: boolean
        default: false

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: PawOrmstrupMadsen/claude-batch-review@main
        with:
          api-keys: ${{ secrets.ANTHROPIC_REVIEW_KEYS }}
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          force: ${{ inputs.force || false }}
