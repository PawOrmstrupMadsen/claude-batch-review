name: Claude review
# Required PR review by Claude through the Message Batches API (PawOrmstrupMadsen/claude-batch-review).
on:
  pull_request:
    # labeled/unlabeled re-evaluate the override label, reusing the head commit's stored review.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      force:
        description: Re-review a commit that already has a review
        type: boolean
        default: false

concurrency:
  # Label events get their own group, so adding a label never cancels a review that is still waiting.
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}-${{ contains(github.event.action, 'labeled') && 'label' || 'review' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # The job name is the status check that rulesets require.
    name: Claude review
    # Bot PRs (Renovate, Dependabot) are skipped on purpose; a skipped check counts as passed.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot')
    # A self-hosted runner of this repo (never a deploy runner). The job only waits on the network.
    # GitHub-hosted runners (ubuntu-latest) cost Actions minutes in a private repo. A public repo uses
    # ubuntu-latest instead: free there, and fork PRs must never reach a self-hosted runner.
    runs-on: [self-hosted, linux, x64, <repo-label>]
    timeout-minutes: 60
    steps:
      # Pinned to a release; scripts/release.sh in claude-batch-review moves every caller to the next one.
      - uses: PawOrmstrupMadsen/claude-batch-review@main
        with:
          api-keys: ${{ secrets.ANTHROPIC_REVIEW_KEYS }}
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          force: ${{ inputs.force || false }}
          mode: pass
          max-wait-minutes: 45
